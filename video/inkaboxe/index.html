<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <title>InkaBoxe · vídeo de apresentação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=block" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!--
      Composição do vídeo da InkaBoxe (não faz parte do site).
      Abrir em http://localhost:2000/video/inkaboxe/?lang=pt-BR (ou en-US) com `yarn dev`.
      Renderizar: node scripts/render-video.mjs inkaboxe
      As telas da gestão são do sistema real com todos os dados trocados por dados fictícios
      (alunos, contatos, matrículas, valores e contagens). O reconhecimento no tablet é montado aqui,
      sobre um avatar neutro, com os textos da tela de verificação do sistema.
    -->
    <main id="stage"></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
